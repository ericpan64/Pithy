[project]
name = "pithy-cli"
version = "0.1.3"
description = "Your pithy python pair programmer CLI tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "gitpython>=3.1.45",
    "keyring>=25.7.0",
    "openai>=3.37.0",
    "pyyaml>=6.0.3",
    "rich>=14.1.0",
    "typer>=0.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["uv", "setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
pithy_cli = ["builtin_skills/*/SKILL.md"]

[project.scripts]
pithy = "pithy_cli.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
